# Rebuilds the static post pages, feed.xml and sitemap whenever a post changes,
# so posts saved from the /admin/ editor (or from any other place) go live without a local build.
name: Build posts

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "scripts/build_posts.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-posts
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install markdown
          python3 scripts/build_posts.py
      - name: Commit generated files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Rebuild post pages, feed and sitemap"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
